<main class="login-wrap">
  <section class="card rise" id="card">
    <header class="card-head rise d1">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="#fff">
          <path d="M58 30c0-8-10-14-22-14-6 0-11 2-14 6-4-6-10-10-16-10 3 4 4 8 4 12-3 2-5 6-5 10 5-2 10-3 14-2 1 8 9 14 19 14 12 0 20-8 20-16z"/>
          <circle cx="49" cy="27" r="2.4" fill="#18181b"/>
        </svg>
      </div>
      <h1>DSH 本地控制台 <span class="badge">预览版</span></h1>
      <p class="sub">请登录以继续</p>
    </header>

    <form id="loginForm" novalidate>
      <div class="field rise d2" id="field-user">
        <label for="username">用户名</label>
        <div class="control">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="username" name="username" type="text" placeholder="输入用户名" autocomplete="username" />
        </div>
        <p class="msg">请输入用户名</p>
      </div>

      <div class="field rise d3" id="field-pwd">
        <label for="password">密码</label>
        <div class="control">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="password" name="password" type="password" placeholder="输入密码" autocomplete="current-password" />
          <button type="button" class="eye" id="eyeBtn" aria-label="显示密码">
            <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <p class="caps" id="capsHint">大写锁定已开启</p>
        <p class="msg">请输入密码</p>
      </div>

      <div class="row rise d4">
        <label class="check">
          <input type="checkbox" name="remember" id="remember" />
          <span class="box" aria-hidden="true"></span>记住我
        </label>
        <span class="tip">仅限本地访问</span>
      </div>

      <p class="form-error" id="formError" role="alert"></p>

      <button class="submit rise d4" id="submitBtn" type="submit">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">登录</span>
      </button>
    </form>

    <footer class="card-foot rise d5">
      <span class="dot" aria-hidden="true"></span>
      服务运行中 · <span id="loginHost"></span>
    </footer>
  </section>
</main>
