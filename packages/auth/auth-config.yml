# Authentication plugin configuration for web-app bundle
# Add these rows to enable user authentication

- insert:
    # Backend authentication service with SQLite storage
    - id: auth-local
      name: '@deepseek-ai/dsh-auth-local'
      inject: [webServer, database]
      config:
        enabled: true
        cookieName: dsh_session
        sessionDuration: 604800  # 7 days in seconds
        dbPath: auth.db
        bcryptRounds: 12

    # CLI commands for user management
    - id: cli-auth
      name: '@deepseek-ai/dsh-cli-auth'
      inject: [authLocal, commands]

    # Frontend authentication UI
    - id: ui-auth
      name: '@deepseek-ai/dsh-client-ui-auth'
